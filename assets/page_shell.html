<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Default typeface trio only. Themed pages load any additional fonts via
     their own font_import <link> (inserted at assembly time). -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shell/shell.css">
<style id="content-overrides"></style>
</head>
<body>

<!-- Toolbar -->
<div id="mp-toolbar">
  <button id="mp-btn-print">Print / Save PDF</button>
  <div class="mp-sep"></div>
  <!-- Combined edit+chat toggle: shell.js owns the mode and label; chat.js
       (when present) opens/closes the side panel through the mode hook. -->
  <button id="mp-btn-edit">
    <svg class="mp-icon-pencil" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
    <svg class="mp-icon-x" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    <span id="mp-btn-edit-label">Edit</span>
  </button>
  <div class="mp-sep"></div>
  <select id="mp-paper-select" title="Paper size" onchange="applySize(this.value)">
    <option value="letter">US Letter</option>
    <option value="landscape">Letter Landscape</option>
    <option value="a4">A4</option>
    <option value="legal">Legal</option>
    <option value="half">Half Letter</option>
  </select>
  <!-- Variant nav — hidden until JS detects multiple .variant-page elements -->
  <div class="mp-sep" id="mp-variant-sep" style="display:none"></div>
  <div id="mp-variant-nav" style="display:none; align-items:center; gap:8px;">
    <button id="mp-btn-prev" class="mp-nav-btn" title="Previous variant">&#8592;</button>
    <span id="mp-variant-label" style="font-family:var(--font-label);font-size:11px;color:var(--color-mid);white-space:nowrap;letter-spacing:0.04em;">1 / 5</span>
    <button id="mp-btn-next" class="mp-nav-btn" title="Next variant">&#8594;</button>
  </div>
</div>

<!-- Edit overlay -->
<div id="mp-overlay"></div>

<!-- Page canvas -->
<div class="page-surround">
  <div class="page" id="page">
    <!-- CONTENT -->
    <footer><span></span><span></span></footer>
  </div>
</div>

<!-- @page updated dynamically when paper size changes. Zero margin: the .page
     element is the sheet itself, printed 1:1 — WYSIWYG. shell.css carries the
     matching static letter dimensions, so a script-less print is still exact. -->
<style id="dynamic-page-css">@page { size: letter; margin: 0; }</style>

<script src="shell/shell.js"></script>
<script src="shell/chat.js"></script>
</body>
</html>
